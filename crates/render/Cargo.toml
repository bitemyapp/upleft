[package]
name = "upleft-render"
description = "Port of Downright's MarkdownRender: themes, style sheet, metrics, syntax highlighting, render contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
block2.workspace = true
dispatch2 = "0.3"
libc = "0.2"
objc2.workspace = true
upleft-core.workspace = true
upleft-math.workspace = true
upleft-swift-text.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSAttributedString",
    "block2",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSLock",
    "NSObject",
    "NSPathUtilities",
    "NSRange",
    "NSString",
    "NSURL",
    "NSUserDefaults",
    "NSUUID",
    "NSValue",
    "NSRunLoop",
    "NSProcessInfo",
    "NSObjCRuntime",
    "NSAttributedString",
    "NSNotification",
    "NSUndoManager",
    "NSCharacterSet",
    "NSSet",
    "NSPropertyList",
    "NSOperation",
    "NSURL",
    "NSIndexSet",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSColor",
    "NSColorSpace",
    "NSFont",
    "NSFontDescriptor",
    "NSParagraphStyle",
    "NSResponder",
    "NSStringDrawing",
    "NSText",
    "NSTextAttachment",
    "NSTextStorage",
    "NSImage",
    "NSWorkspace",
    "NSAnimationContext",
    "NSView",
    "NSWindow",
    "NSGraphics",
    "NSGraphicsContext",
    "NSBezierPath",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
    "NSClipView",
    "NSScrollView",
    "NSScroller",
    "NSScreen",
    "NSControl",
    "NSCell",
    "NSTextAttachment",
    "NSTextList",
    "NSText",
    "NSTextView",
    "NSTextContainer",
    "NSTextStorage",
    "NSTextContentManager",
    "NSTextLayoutManager",
    "NSTextLayoutFragment",
    "NSTextLineFragment",
    "NSTextElement",
    "NSTextRange",
    "NSTextSelection",
    "NSTextSelectionNavigation",
    "NSTextViewportLayoutController",
    "NSParagraphStyle",
    "NSStringDrawing",
    "NSTrackingArea",
    "NSEvent",
    "NSCursor",
    "NSMenu",
    "NSMenuItem",
    "NSPasteboard",
    "NSDragging",
    "NSSound",
    "NSUserInterfaceItemIdentification",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSAccessibilityConstants",
    "NSAccessibilityCustomAction",
    "NSLayoutConstraint",
    "NSTextInputClient",
    "NSTextCheckingClient",
    "NSSpellProtocol",
    "NSDraggingItem",
    "NSPanel",
    "NSTableView",
    "NSTableColumn",
    "NSTableCellView",
    "NSTableHeaderView",
    "NSVisualEffectView",
    "NSTextField",
    "NSHapticFeedback",
    "NSLayoutAnchor",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-core-graphics", "CABase", "CAAnimation", "CADisplayLink", "CAMediaTiming",
    "CAMediaTimingFunction", "CATransform3D", "CALayer", "CATransaction",
] }
objc2-core-foundation = { workspace = true, features = ["CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFPreferences", "CFPropertyList", "CFString", "CFURL"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-core-graphics = { workspace = true, features = ["CGContext", "CGPath", "CGColor", "CGImage", "CGColorSpace"] }
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "SFNTLayoutTypes", "objc2-core-graphics"] }

[dev-dependencies]
serde_json.workspace = true
objc2-app-kit = { workspace = true, features = ["NSImage", "NSRunningApplication", "NSBitmapImageRep", "NSScrollView", "NSFontManager"] }
objc2-core-foundation = { workspace = true, features = ["CFRunLoop"] }
# The hosted_transcript example installs the Mermaid renderer, as every host does.
upleft-mermaid.workspace = true
upleft-math.workspace = true

[[test]]
name = "directory_watcher"
harness = false

[[test]]
name = "view_tests"
path = "tests/view_tests/main.rs"
harness = false

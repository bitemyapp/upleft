[package]
name = "upleft-swift-text"
description = "Swift String/Character, Foundation CharacterSet and NSString semantics, with Unicode tables generated from the Swift runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObjCRuntime", "NSRange", "NSArray", "NSEnumerator"] }
objc2-core-foundation = { workspace = true, features = ["CFString"] }
unicode-normalization = "0.1.25"

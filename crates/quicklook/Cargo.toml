[package]
name = "upleft-quicklook"
description = "Port of Downright's DownrightQL policy: Quick Look resource limits, the bounded loader and the preview controller's pure helpers (the view code is ported with the UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
upleft-core.workspace = true
upleft-swift-text.workspace = true
libc = "0.2"

[dev-dependencies]
upleft-render.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSString"] }
objc2-app-kit = { workspace = true, features = ["NSAppearance"] }

[package]
name = "upleft-app"
description = "Port of DownrightApp's non-UI layer: the document model, persistence, workspace, export, review, trust, commands, preferences, updater logic and integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
upleft-core.workspace = true
upleft-render.workspace = true
upleft-math.workspace = true
upleft-mermaid.workspace = true
upleft-swift-text.workspace = true
upleft-foundation.workspace = true
upleft-cli.workspace = true
upleft-spotlight-metadata.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2 = "0.3.1"
libc = "0.2"
sha2 = "0.10"
objc2-foundation = { workspace = true, features = [
    "NSAppleEventDescriptor", "NSAppleScript", "NSArray", "NSAttributedString", "NSBundle", "NSCharacterSet", "NSData", "NSDate", "NSDateFormatter",
    "NSDictionary", "NSEnumerator", "NSError", "NSFileCoordinator", "NSFileManager", "NSFilePresenter",
    "NSFileVersion", "NSFileWrapper", "NSFormatter", "NSHTTPCookieStorage", "NSISO8601DateFormatter", "NSIndexSet", "NSJSONSerialization",
    "NSLocale", "NSLock", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSOperation", "NSPathUtilities",
    "NSProcessInfo", "NSRange", "NSRegularExpression", "NSRunLoop", "NSString", "NSTextCheckingResult", "NSThread", "NSTimer", "NSURL", "NSURLCache", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSUUID", "NSUndoManager", "NSUserDefaults",
    "NSValue", "NSXMLDocument", "NSXMLElement", "NSXMLNode", "NSXMLParser", "block2",
    "NSGeometry", "NSSet", "NSRelativeDateTimeFormatter", "NSNumberFormatter", "NSByteCountFormatter", "NSItemProvider",
    "NSKeyValueCoding", "NSKeyValueObserving", "NSOrderedSet", "NSSortDescriptor", "NSCalendar", "NSTimeZone", "NSDistributedNotificationCenter",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAlert", "NSAppearance", "NSApplication", "NSAttributedString", "NSBitmapImageRep", "NSColor", "NSColorSpace", "NSEvent", "NSFont", "NSGraphics", "NSImage", "NSImageRep", "NSParagraphStyle", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSSpeechSynthesizer", "NSText", "NSTextStorage", "NSWorkspace", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers",
    # The panels (Panels/): views, controls, tables, windows and layers.
    "NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityCustomAction", "NSAccessibilityElement", "NSAccessibilityProtocols",
    "NSAnimation", "NSAnimationContext", "NSBezierPath", "NSBox", "NSButton", "NSButtonCell", "NSCell", "NSClipView", "NSColorList",
    "NSControl", "NSCursor", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSFontDescriptor", "NSFontManager", "NSGlassEffectView",
    "NSGraphicsContext", "NSHapticFeedback", "NSImageCell", "NSImageView", "NSLayoutAnchor", "NSLayoutConstraint", "NSLayoutGuide",
    "NSMenu", "NSMenuItem", "NSPanel", "NSPopUpButton", "NSPopUpButtonCell", "NSPopover", "NSProgressIndicator", "NSScreen", "NSScrollView",
    "NSScroller", "NSSearchField", "NSSearchFieldCell", "NSSegmentedControl", "NSSegmentedCell", "NSShadow", "NSSplitView", "NSStackView",
    "NSStringDrawing", "NSSwitch", "NSTableCellView", "NSTableColumn", "NSTableHeaderView", "NSTableRowView", "NSTableView",
    "NSTableViewDiffableDataSource", "NSTextAttachment", "NSTextContainer", "NSTextField", "NSTextFieldCell", "NSTextLayoutManager",
    "NSTextContentManager", "NSTextView", "NSTextCheckingClient", "NSTextInputClient", "NSTrackingArea", "NSUserInterfaceCompression",
    "NSUserInterfaceItemIdentification", "NSUserInterfaceLayout", "NSUserInterfaceValidation", "NSView", "NSViewController",
    "NSVisualEffectView", "NSWindow", "NSWindowController", "NSSpellProtocol", "NSKeyValueBinding", "NSLayoutManager", "NSSharingService",
    "NSPasteboardItem", "NSItemProvider", "NSTextList", "NSTextTable", "NSGestureRecognizer", "NSClickGestureRecognizer", "NSToolbar",
    "NSToolbarItem", "NSTitlebarAccessoryViewController", "NSWindowScripting", "NSSound", "NSTextFinder", "NSSecureTextField",
    "objc2-core-graphics", "objc2-quartz-core", "objc2-core-text",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-core-graphics", "CABase", "CAAnimation", "CADisplayLink", "CAMediaTiming",
    "CAMediaTimingFunction", "CATransform3D", "CALayer", "CATransaction", "CAShapeLayer", "CATextLayer", "CAGradientLayer",
    "CAReplicatorLayer", "CAScrollLayer",
] }
objc2-core-graphics = { workspace = true, features = ["CGContext", "CGPath", "CGColor", "CGColorSpace", "CGImage", "CGAffineTransform", "CGGeometry"] }
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "objc2-core-graphics"] }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "AVSpeechSynthesis"] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFBase", "CFCGTypes", "CFDate", "CFRunLoop", "CFString", "CFURL"] }

[dev-dependencies]
serde_json.workspace = true
objc2-foundation = { workspace = true, features = ["NSURLProtocol"] }

# The updater's main-actor objects hop through the main dispatch queue, so
# these tests own the main thread (no libtest harness) and run its run loop.
[[test]]
name = "update_coordinator_tests"
harness = false

[[test]]
name = "release_watch_probe_tests"
harness = false

# AppKit objects that must be created on the main thread: the test binary's
# own `main` runs there.
[[test]]
name = "main_thread_objects"
harness = false

# Suites whose Swift originals run on the main actor own the main thread
# (tests/main_thread/mod.rs).
[[test]]
name = "local_ai_tests"
harness = false

[[test]]
name = "app_intents_tests"
harness = false

[[test]]
name = "file_watcher_tests"
harness = false

[[test]]
name = "async_parse_tests"
harness = false

[[test]]
name = "document_trust_state_tests"
harness = false

[[test]]
name = "review_baseline_document_tests"
harness = false

[[test]]
name = "app_layer_document_tests"
harness = false

[[test]]
name = "autosave_lifecycle_tests"
harness = false

[[test]]
name = "document_edit_projection_tests"
harness = false

[[test]]
name = "markdown_document_tests"
harness = false

[[test]]
name = "workspace_tests"
harness = false

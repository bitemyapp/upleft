# The updater's main-actor objects hop through the main dispatch queue, so
# these tests own the main thread (no libtest harness) and run its run loop.
[[test]]
name = "update_coordinator_tests"
harness = false

[[test]]
name = "sparkle_bridge_tests"
harness = false

[[test]]
name = "release_watch_probe_tests"
harness = false

# AppKit objects that must be created on the main thread: the test binary's
# own `main` runs there.
[[test]]
name = "main_thread_objects"
harness = false

# Suites whose Swift originals run on the main actor own the main thread
# (tests/main_thread/mod.rs).
[[test]]
name = "local_ai_tests"
harness = false

[[test]]
name = "app_intents_tests"
harness = false

[[test]]
name = "file_watcher_tests"
harness = false

[[test]]
name = "async_parse_tests"
harness = false

[[test]]
name = "document_trust_state_tests"
harness = false

[[test]]
name = "review_baseline_document_tests"
harness = false

[[test]]
name = "app_layer_document_tests"
harness = false

[[test]]
name = "autosave_lifecycle_tests"
harness = false

[[test]]
name = "document_edit_projection_tests"
harness = false

[[test]]
name = "markdown_document_tests"
harness = false

[[test]]
name = "workspace_tests"
harness = false

[[test]]
name = "command_table_tests_menu"
harness = false

[[test]]
name = "document_quick_look_tests_menu"
harness = false

[[test]]
name = "share_and_capture_tests_menu"
harness = false

[[test]]
name = "app_shell_menu_objects"
harness = false

# The document scroll gestures (`App/DocumentScrollGestures.swift` and the
# swipes and zoom built on it): `@MainActor` suites over AppKit views and
# `NSEvent`s, on the main thread (tests/main_thread/mod.rs).
[[test]]
name = "history_swipe_tests"
harness = false

[[test]]
name = "presentation_drag_tests"
harness = false

[[test]]
name = "presentation_swipe_tests"
harness = false

[[test]]
name = "presentation_swipe_budget_tests"
harness = false

[[test]]
name = "scroll_gesture_chain_tests"
harness = false

[[test]]
name = "scroll_zoom_tests"
harness = false
[[test]]
name = "settings_pane_tests"
harness = false

# The panels' view-level tests (DownrightAppTests), one binary per group of
# panels; each runs on the main thread (tests/main_thread/mod.rs) and puts any
# window it needs off-screen, never activated.

[[test]]
name = "panels_chrome_tests"
harness = false

[[test]]
name = "panels_toolbar_tests"
harness = false

[[test]]
name = "panels_find_tests"
harness = false

[[test]]
name = "panels_task_tests"
harness = false

[[test]]
name = "panels_update_tests"
harness = false

[[test]]
name = "panels_editor_tests"
harness = false

[[test]]
name = "panels_diagnostics_tests"
harness = false

[[test]]
name = "panels_sidebar_tests"
harness = false

# The toolbar controls, `ToolbarGlassBand` and `DocumentWindow`
# (`App/ToolbarControls.swift`, `App/ToolbarGlassBand.swift`,
# `App/DocumentWindow.swift`): `@MainActor` suites over AppKit views, on the
# main thread (tests/main_thread/mod.rs).
[[test]]
name = "window_chrome_tests"
harness = false

[[test]]
name = "toolbar_controls_tests"
harness = false

# The start window (`App/StartWindowController.swift`): the `@MainActor`
# StartWindowTests and RecentRowSubtitleTests, on the main thread
# (tests/main_thread/mod.rs), in a sandboxed home.
[[test]]
name = "start_window_tests_window"
harness = false

# `DocumentWindowController` (`App/DocumentWindowController.swift` and its
# +Support/+Trust/+Speech/+CommandLine/+ContinuityCamera extensions): the
# `@MainActor` suites that build the controller, on the main thread
# (tests/main_thread/mod.rs), in a sandboxed home
# (tests/document_window_support/mod.rs); no window is ordered in.
[[test]]
name = "window_chrome_tests_document"
harness = false

[[test]]
name = "document_chrome_layout_tests"
harness = false

[[test]]
name = "autosave_lifecycle_tests_window"
harness = false

[[test]]
name = "export_snapshot_tests"
harness = false

# Window-level cases of the DocumentWindowController panel extensions
# (`+AssetInsertion`, `+ContinuityCamera`, `+CommandPalette`): main-thread
# suites over a real controller whose window is never ordered in.
[[test]]
name = "document_drop_tests_window"
harness = false

[[test]]
name = "share_and_capture_tests_window"
harness = false

[[test]]
name = "command_palette_navigation_regression_tests"
harness = false

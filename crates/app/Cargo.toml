[package]
name = "upleft-app"
description = "Port of DownrightApp's non-UI layer: the document model, persistence, workspace, export, review, trust, commands, preferences, updater logic and integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
upleft-core.workspace = true
upleft-render.workspace = true
upleft-swift-text.workspace = true
upleft-foundation.workspace = true
upleft-cli.workspace = true
upleft-spotlight-metadata.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2 = "0.3.1"
libc = "0.2"
sha2 = "0.10"
objc2-foundation = { workspace = true, features = [
    "NSAppleEventDescriptor", "NSAppleScript", "NSArray", "NSAttributedString", "NSBundle", "NSCharacterSet", "NSData", "NSDate", "NSDateFormatter",
    "NSDictionary", "NSEnumerator", "NSError", "NSFileCoordinator", "NSFileManager", "NSFilePresenter",
    "NSFileVersion", "NSFileWrapper", "NSFormatter", "NSHTTPCookieStorage", "NSISO8601DateFormatter", "NSIndexSet", "NSJSONSerialization",
    "NSLocale", "NSLock", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSOperation", "NSPathUtilities",
    "NSProcessInfo", "NSRange", "NSRegularExpression", "NSRunLoop", "NSString", "NSTextCheckingResult", "NSThread", "NSTimer", "NSURL", "NSURLCache", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSUUID", "NSUndoManager", "NSUserDefaults",
    "NSValue", "NSXMLDocument", "NSXMLElement", "NSXMLNode", "NSXMLParser", "block2",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAlert", "NSAppearance", "NSApplication", "NSAttributedString", "NSColor", "NSFont", "NSGraphics", "NSImage", "NSParagraphStyle",
    "NSPasteboard", "NSResponder", "NSSpeechSynthesizer", "NSText", "NSTextStorage", "NSWorkspace", "block2",
    "objc2-core-foundation",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFBase", "CFDate", "CFRunLoop", "CFString", "CFURL"] }

[dev-dependencies]
serde_json.workspace = true
objc2-foundation = { workspace = true, features = ["NSURLProtocol"] }

# The updater's main-actor objects hop through the main dispatch queue, so
# these tests own the main thread (no libtest harness) and run its run loop.
[[test]]
name = "update_coordinator_tests"
harness = false

[[test]]
name = "release_watch_probe_tests"
harness = false

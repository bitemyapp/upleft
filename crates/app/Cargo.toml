[package]
name = "upleft-app"
description = "Port of DownrightApp's non-UI layer: the document model, persistence, workspace, export, review, trust, commands, preferences, updater logic and integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
upleft-core.workspace = true
upleft-render.workspace = true
upleft-swift-text.workspace = true
upleft-foundation.workspace = true
upleft-cli.workspace = true
upleft-spotlight-metadata.workspace = true
objc2.workspace = true
block2.workspace = true
dispatch2 = "0.3.1"
libc = "0.2"
sha2 = "0.10"
objc2-foundation = { workspace = true, features = [
    "NSArray", "NSAttributedString", "NSBundle", "NSCharacterSet", "NSData", "NSDate", "NSDateFormatter",
    "NSDictionary", "NSEnumerator", "NSError", "NSFileCoordinator", "NSFileManager", "NSFilePresenter",
    "NSFileVersion", "NSFileWrapper", "NSFormatter", "NSISO8601DateFormatter", "NSIndexSet", "NSJSONSerialization",
    "NSLocale", "NSLock", "NSNotification", "NSNull", "NSObjCRuntime", "NSObject", "NSOperation", "NSPathUtilities",
    "NSProcessInfo", "NSRange", "NSRegularExpression", "NSString", "NSTextCheckingResult", "NSThread", "NSTimer",
    "NSUndoManager", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSUserDefaults", "NSUUID",
    "NSValue", "NSXMLDocument", "NSXMLElement", "NSXMLNode", "NSXMLParser", "block2",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAppearance", "NSApplication", "NSAttributedString", "NSColor", "NSFont", "NSImage", "NSParagraphStyle",
    "NSPasteboard", "NSResponder", "NSSpeechSynthesizer", "NSText", "NSTextStorage", "NSWorkspace", "block2",
    "objc2-core-foundation",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = ["std", "UTType", "UTCoreTypes"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFBase", "CFDate", "CFRunLoop", "CFString", "CFURL"] }

[dev-dependencies]
serde_json.workspace = true

# Suites whose Swift originals run on the main actor own the main thread
# (tests/main_thread/mod.rs).
[[test]]
name = "local_ai_tests"
harness = false

[[test]]
name = "app_intents_tests"
harness = false

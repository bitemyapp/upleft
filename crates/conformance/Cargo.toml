[package]
name = "upleft-conformance"
description = "Differential conformance between Upleft and the Swift Downright it ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
png = "0.18"
upleft-markup.workspace = true
upleft-core.workspace = true
upleft-swift-text.workspace = true
upleft-render.workspace = true
upleft-math.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry",
    "NSNotification", "NSRange", "NSString", "NSValue",
    "NSURL", "block2",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSClipView", "NSColor", "NSColorList", "NSColorSpace",
    "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder",
    "NSRunningApplication", "NSScrollView", "NSText", "NSTextView", "NSView", "NSWindow", "NSLayoutConstraint",
    "NSTextStorage", "NSTextContentManager", "NSTextLayoutManager", "NSTextLayoutFragment", "NSTextLineFragment",
    "NSTextRange", "NSTextContainer", "NSTextSelectionNavigation",
    "objc2-core-graphics",
    "NSAttributedString", "NSParagraphStyle", "NSShadow", "NSTextAttachment", "NSTextList", "NSTextStorage",
    "NSTextTable",
] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage"] }
objc2-core-text = { workspace = true, features = ["objc2-core-graphics", "CTFont", "CTFontDescriptor", "CTLine", "CTRun", "CTStringAttributes"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager",
] }
block2.workspace = true
dispatch2 = "0.3.1"

[[bin]]
name = "conform"
path = "src/bin/conform.rs"

[[bin]]
name = "upleft-oracle"
path = "src/bin/upleft-oracle.rs"

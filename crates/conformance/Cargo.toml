[package]
name = "upleft-conformance"
description = "Differential conformance between Upleft and the Swift Downright it ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
png = "0.18"
upleft-markup.workspace = true
upleft-core.workspace = true
upleft-swift-text.workspace = true
upleft-render.workspace = true
upleft-mermaid.workspace = true
upleft-elk.workspace = true
upleft-math.workspace = true
upleft-foundation.workspace = true
upleft-spotlight-metadata.workspace = true
upleft-cli.workspace = true
upleft-app.workspace = true
upleft-quicklook.workspace = true
upleft-thumb.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = [
    "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry",
    "NSJSONSerialization", "NSNotification", "NSRange", "NSString", "NSURL", "NSURLCache", "NSURLProtocol", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSUUID", "NSUserDefaults", "NSValue", "block2",
    "NSBundle", "NSProcessInfo",
] }
objc2-app-kit = { workspace = true, features = [
    "NSAppearance", "NSApplication", "NSBitmapImageRep", "NSEvent", "NSClipView", "NSColor", "NSColorList", "NSColorSpace",
    "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSResponder",
    "NSRunningApplication", "NSScreen", "NSScrollView", "NSText", "NSTextView", "NSView", "NSWindow", "NSLayoutConstraint",
    "NSTextStorage", "NSTextContentManager", "NSTextLayoutManager", "NSTextLayoutFragment", "NSTextLineFragment",
    "NSTextRange", "NSTextContainer", "NSTextSelectionNavigation",
    "objc2-core-graphics",
    "NSAttributedString", "NSParagraphStyle", "NSShadow", "NSTextAttachment", "NSTextList", "NSTextStorage",
    "NSTextTable", "NSEvent", "NSTableView", "NSTableCellView", "NSControl", "NSTextField", "NSPanel",
    "NSAccessibility", "NSAccessibilityProtocols",
    "NSButton", "NSButtonCell", "NSToolbar", "NSToolbarItem", "NSWindowController", "NSMenu", "NSMenuItem",
    # The panel suites.
    "NSButton", "NSButtonCell", "NSImageView", "NSStackView", "NSTextView", "NSText", "NSUserInterfaceLayout",
    "NSVisualEffectView", "NSGlassEffectView", "NSProgressIndicator", "NSSegmentedControl", "NSPopUpButton", "NSMenu",
    "NSMenuItem", "NSSearchField", "NSTableRowView", "NSTableColumn", "NSCell", "NSTextFieldCell", "block2",
    "NSButton", "NSButtonCell", "NSToolbar", "NSToolbarItem", "NSWindowController",
    "NSAccessibilityCustomAction",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std", "objc2-core-foundation", "objc2-core-graphics", "CALayer", "CAShapeLayer", "CATextLayer", "CAGradientLayer",
    "CATransform3D",
] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { workspace = true, features = ["CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
objc2-core-text = { workspace = true, features = ["objc2-core-graphics", "CTFont", "CTFontDescriptor", "CTLine", "CTRun", "CTStringAttributes"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager",
] }
block2.workspace = true
dispatch2 = "0.3.1"
libc = "0.2"

[[bin]]
name = "conform"
path = "src/bin/conform.rs"

[[bin]]
name = "upleft-oracle"
path = "src/bin/upleft-oracle.rs"

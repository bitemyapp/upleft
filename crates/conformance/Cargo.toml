[package]
name = "upleft-conformance"
description = "Differential conformance between Upleft and the Swift Downright it ports"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json.workspace = true
png = "0.18"
upleft-markup.workspace = true
upleft-render.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSValue"] }
objc2-app-kit = { workspace = true, features = ["NSAppearance", "NSColor", "NSColorList", "NSColorSpace", "NSFont", "NSFontDescriptor"] }

[[bin]]
name = "conform"
path = "src/bin/conform.rs"

[[bin]]
name = "upleft-oracle"
path = "src/bin/upleft-oracle.rs"

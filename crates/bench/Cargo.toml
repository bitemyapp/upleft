[package]
name = "upleft-bench"
description = "Downright's drbench performance budget (§12), stage for stage, against Upleft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
upleft-markup.workspace = true
upleft-core.workspace = true
upleft-render.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSAttributedString", "NSRange", "NSString"] }
objc2-app-kit = { workspace = true, features = ["NSAppearance", "NSAttributedString", "NSTextStorage"] }

[[bin]]
name = "upleft-bench"
path = "src/main.rs"
